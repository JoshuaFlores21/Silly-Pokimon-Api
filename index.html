<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4c1d95">
  <title>Semi Api de pokimon</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #24134b;
      background: #f4f0ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 15% 15%, rgb(196 181 253 / 42%), transparent 35%),
        radial-gradient(ellipse at 90% 80%, rgb(221 214 254 / 55%), transparent 32%),
        #f4f0ff;
    }

    button, input, select { font: inherit; }

    .page {
      width: min(100% - 32px, 850px);
      margin: 0 auto;
      padding: 56px 0 40px;
    }

    .heading { margin-bottom: 28px; text-align: center; }

    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      padding: 6px 12px;
      border: 1px solid #ddd6fe;
      border-radius: 999px;
      color: #6d28d9;
      background: #fff;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #3b176e;
      font-size: clamp(2.1rem, 7vw, 3.4rem);
      letter-spacing: -.045em;
    }

    .subtitle { margin: 12px 0 0; color: #71668b; }

    .search-card, .result-card {
      border: 1px solid #e7e0f5;
      border-radius: 22px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 18px 50px rgb(61 32 106 / 10%);
    }

    .search-card { padding: 24px; }

    .search-label {
      display: block;
      margin-bottom: 10px;
      font-size: .9rem;
      font-weight: 700;
    }

    .search-row { display: flex; gap: 10px; }

    input, select {
      min-height: 48px;
      border: 1px solid #d8cdec;
      border-radius: 12px;
      outline: none;
      color: #30204b;
      background: #fff;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 0 14px;
    }

    select { padding: 0 34px 0 12px; }

    input:focus, select:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgb(139 92 246 / 17%);
    }

    .primary-button {
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #6d28d9, #4f46e5);
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .primary-button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgb(91 33 182 / 24%); }
    .primary-button:disabled { opacity: .65; cursor: wait; transform: none; }

    .hint { margin: 10px 0 0; color: #817894; font-size: .84rem; }

    .message { min-height: 24px; margin: 12px 0 0; color: #6d28d9; font-size: .9rem; }
    .message.error { color: #b4234b; }

    .result-card { margin-top: 20px; overflow: hidden; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px 16px;
    }

    .result-header h2 { margin: 0; color: #3b176e; font-size: 1.25rem; }
    .result-header p { margin: 5px 0 0; color: #827793; font-size: .86rem; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 24px 16px;
    }

    .tab {
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #e5ddf2;
      border-radius: 11px;
      color: #625477;
      background: #fff;
      font-size: .9rem;
      font-weight: 650;
      cursor: pointer;
    }

    .tab:hover { border-color: #bda5ec; color: #5b21b6; }
    .tab[aria-selected="true"] { border-color: #6d28d9; color: #fff; background: #6d28d9; }

    .panel {
      min-height: 190px;
      padding: 22px 24px 26px;
      border-top: 1px solid #eee8f6;
      background: #fcfbff;
    }

    .panel[hidden], .result-card[hidden] { display: none; }

    .details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
      font-family: "Comic Sans MS", "Comic Sans", cursive;
    }

    .detail {
      padding: 13px;
      border: 1px solid #ece5f8;
      border-radius: 12px;
      background: #fff;
    }

    .detail strong { display: block; margin-bottom: 6px; color: #6d28d9; font-size: .85rem; }
    .detail span { overflow-wrap: anywhere; color: #30204b; }

    .list-title { margin: 0 0 12px; font-size: 1rem; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }

    .tag {
      padding: 7px 11px;
      border: 1px solid #ddd6fe;
      border-radius: 999px;
      color: #542398;
      background: #f2edff;
      font-size: .88rem;
    }

    .empty-list { margin: 0; color: #71668b; }
    .image-panel { display: grid; min-height: 220px; place-items: center; }
    .image-panel img { display: block; width: min(100%, 300px); height: 250px; object-fit: contain; }

    .footer { margin-top: 18px; color: #887e99; font-size: .8rem; text-align: center; }
    .footer a { color: #6d28d9; }

    @media (max-width: 580px) {
      .page { width: min(100% - 20px, 850px); padding-top: 38px; }
      .search-card { padding: 18px; }
      .search-row { flex-wrap: wrap; }
      .search-row input { flex-basis: 100%; }
      .search-row select { flex: 1; }
      .primary-button { flex: 1; padding: 0 12px; }
      .result-header { padding: 18px 18px 14px; }
      .tabs { gap: 6px; padding: 0 12px 14px; }
      .tab { padding: 8px 5px; font-size: .78rem; }
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="heading">
      <span class="eyebrow">Explora PokéAPI</span>
      <h1>Semi Api de pokimon</h1>
      <p class="subtitle">Busca un Pokémon o un objeto y descubre sus detalles.</p>
    </header>

    <form class="search-card" id="search-form">
      <label class="search-label" for="search-input">¿Qué quieres buscar?</label>
      <div class="search-row">
        <input id="search-input" name="query" type="search" placeholder="Ejemplo: pikachu o potion" autocomplete="off" required>
        <select id="search-type" aria-label="Tipo de búsqueda">
          <option value="pokemon">Pokémon</option>
          <option value="item">Objeto</option>
        </select>
        <button class="primary-button" id="search-button" type="submit">Buscar</button>
      </div>
      <p class="hint">Escribe un nombre o número de la PokéAPI.</p>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>

    <section class="result-card" id="result-card" aria-labelledby="result-title" hidden>
      <header class="result-header">
        <div>
          <h2 id="result-title">Resultado</h2>
          <p id="result-subtitle"></p>
        </div>
      </header>
      <div class="tabs" role="tablist" aria-label="Información del resultado">
        <button class="tab" id="tab-details" type="button" role="tab" aria-controls="panel-details" aria-selected="true" data-panel="details">Datos</button>
        <button class="tab" id="tab-abilities" type="button" role="tab" aria-controls="panel-abilities" aria-selected="false" data-panel="abilities">Habilidades y movimientos</button>
        <button class="tab" id="tab-image" type="button" role="tab" aria-controls="panel-image" aria-selected="false" data-panel="image">Imagen</button>
      </div>
      <div class="panel" id="panel-details" role="tabpanel" aria-labelledby="tab-details"></div>
      <div class="panel" id="panel-abilities" role="tabpanel" aria-labelledby="tab-abilities" hidden></div>
      <div class="panel image-panel" id="panel-image" role="tabpanel" aria-labelledby="tab-image" hidden></div>
    </section>

    <footer class="footer">Datos proporcionados por <a href="https://pokeapi.co/" target="_blank" rel="noreferrer">PokéAPI</a>.</footer>
  </main>

  <script>
    const form = document.querySelector("#search-form");
    const searchInput = document.querySelector("#search-input");
    const searchType = document.querySelector("#search-type");
    const searchButton = document.querySelector("#search-button");
    const message = document.querySelector("#message");
    const resultCard = document.querySelector("#result-card");
    const resultTitle = document.querySelector("#result-title");
    const resultSubtitle = document.querySelector("#result-subtitle");
    const detailsPanel = document.querySelector("#panel-details");
    const abilitiesPanel = document.querySelector("#panel-abilities");
    const imagePanel = document.querySelector("#panel-image");
    const tabs = [...document.querySelectorAll(".tab")];
    const panels = {
      details: detailsPanel,
      abilities: abilitiesPanel,
      image: imagePanel
    };

    function formatName(value) {
      return value.replaceAll("-", " ").replace(/\b\w/g, character => character.toUpperCase());
    }

    function addDetail(container, label, value) {
      const card = document.createElement("div");
      card.className = "detail";
      const heading = document.createElement("strong");
      heading.textContent = label;
      const text = document.createElement("span");
      text.textContent = value;
      card.append(heading, text);
      container.append(card);
    }

    function addTagList(container, title, values) {
      const section = document.createElement("section");
      const heading = document.createElement("h3");
      heading.className = "list-title";
      heading.textContent = title;
      section.append(heading);
      if (values.length) {
        const list = document.createElement("div");
        list.className = "tag-list";
        values.forEach(value => {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = formatName(value);
          list.append(tag);
        });
        section.append(list);
      } else {
        const empty = document.createElement("p");
        empty.className = "empty-list";
        empty.textContent = "No hay información disponible.";
        section.append(empty);
      }
      container.append(section);
    }

    function showPanel(name) {
      tabs.forEach(tab => {
        const selected = tab.dataset.panel === name;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      Object.entries(panels).forEach(([key, panel]) => {
        panel.hidden = key !== name;
      });
    }

    function renderPokemon(data) {
      const types = data.types.map(entry => formatName(entry.type.name)).join(", ");
      resultTitle.textContent = formatName(data.name);
      resultSubtitle.textContent = `Pokémon #${data.id}`;
      detailsPanel.replaceChildren();
      addDetail(detailsPanel, "Número", `#${data.id}`);
      addDetail(detailsPanel, "Tipo", types);
      addDetail(detailsPanel, "Altura", `${data.height / 10} m`);
      addDetail(detailsPanel, "Peso", `${data.weight / 10} kg`);
      addDetail(detailsPanel, "Experiencia base", String(data.base_experience));
      addDetail(detailsPanel, "Tipo de búsqueda", "Pokémon");

      abilitiesPanel.replaceChildren();
      addTagList(abilitiesPanel, "Habilidades", data.abilities.map(entry => entry.ability.name));
      addTagList(abilitiesPanel, "Movimientos", data.moves.slice(0, 40).map(entry => entry.move.name));

      imagePanel.replaceChildren();
      const imageUrl = data.sprites.other?.["official-artwork"]?.front_default
        || data.sprites.front_default;
      if (imageUrl) {
        const image = document.createElement("img");
        image.src = imageUrl;
        image.alt = `Imagen de ${formatName(data.name)}`;
        imagePanel.append(image);
      } else {
        const empty = document.createElement("p");
        empty.className = "empty-list";
        empty.textContent = "No hay imagen disponible para este Pokémon.";
        imagePanel.append(empty);
      }
    }

    function renderItem(data) {
      resultTitle.textContent = formatName(data.name);
      resultSubtitle.textContent = `Objeto #${data.id}`;
      detailsPanel.replaceChildren();
      addDetail(detailsPanel, "Número", `#${data.id}`);
      addDetail(detailsPanel, "Categoría", formatName(data.category.name));
      addDetail(detailsPanel, "Precio", Number.isFinite(data.cost) ? `${data.cost} monedas` : "No disponible");
      addDetail(detailsPanel, "Tipo de búsqueda", "Objeto");
      const description = data.effect_entries.find(entry => entry.language.name === "es")
        || data.effect_entries.find(entry => entry.language.name === "en");
      addDetail(detailsPanel, "Efecto", description?.short_effect || "Sin descripción disponible.");

      abilitiesPanel.replaceChildren();
      addTagList(abilitiesPanel, "Habilidades y movimientos", []);

      imagePanel.replaceChildren();
      const imageUrl = data.sprites.default;
      if (imageUrl) {
        const image = document.createElement("img");
        image.src = imageUrl;
        image.alt = `Imagen de ${formatName(data.name)}`;
        imagePanel.append(image);
      } else {
        const empty = document.createElement("p");
        empty.className = "empty-list";
        empty.textContent = "No hay imagen disponible para este objeto.";
        imagePanel.append(empty);
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const query = searchInput.value.trim().toLowerCase().replaceAll(" ", "-");
      if (!query) return;

      searchButton.disabled = true;
      searchButton.textContent = "Buscando...";
      message.className = "message";
      message.textContent = `Buscando ${searchType.value === "pokemon" ? "Pokémon" : "objeto"}...`;
      resultCard.hidden = true;

      try {
        const response = await fetch(`https://pokeapi.co/api/v2/${searchType.value}/${encodeURIComponent(query)}`);
        if (response.status === 404) {
          throw new Error("No encontramos ese resultado. Revisa el nombre o el número e inténtalo de nuevo.");
        }
        if (!response.ok) {
          throw new Error(`La PokéAPI respondió con un error (${response.status}). Inténtalo de nuevo.`);
        }

        const data = await response.json();
        if (searchType.value === "pokemon") renderPokemon(data);
        else renderItem(data);
        resultCard.hidden = false;
        showPanel("details");
        message.textContent = "";
      } catch (error) {
        message.className = "message error";
        message.textContent = error instanceof TypeError
          ? "No se pudo conectar con la PokéAPI. Comprueba tu conexión e inténtalo de nuevo."
          : error.message;
      } finally {
        searchButton.disabled = false;
        searchButton.textContent = "Buscar";
      }
    });

    tabs.forEach(tab => {
      tab.addEventListener("click", () => showPanel(tab.dataset.panel));
      tab.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        const currentIndex = tabs.indexOf(tab);
        const offset = event.key === "ArrowRight" ? 1 : -1;
        const nextTab = tabs[(currentIndex + offset + tabs.length) % tabs.length];
        nextTab.focus();
        showPanel(nextTab.dataset.panel);
      });
    });
  </script>
</body>
</html>
